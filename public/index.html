<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dailymotion — EFOC Video Hub</title>
  <style>
    :root {
      --bg: #eceff4; --accent: #0066dc; --accent-hover: #0053b3; --accent-weak: #eff4ff;
      --border: #e4e7ec; --border-strong: #d0d5dd;
      --text: #101828; --text-2: #475467; --text-3: #667085; --text-4: #98a2b3;
      --surface: #ffffff; --surface-2: #f9fafb;
      --radius-sm: 7px; --radius: 10px; --radius-lg: 16px;
      --shadow-sm: 0 1px 2px rgba(16,24,40,.06);
      --shadow-md: 0 6px 20px rgba(16,24,40,.08);
      --shadow-lg: 0 24px 60px rgba(16,24,40,.28);
      --ring: 0 0 0 3px rgba(0,102,220,.22);
      --ease: .18s cubic-bezier(.4,0,.2,1);
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background:
        radial-gradient(1200px 600px at 100% -10%, #e6edff 0%, rgba(230,237,255,0) 55%),
        radial-gradient(900px 500px at -10% 0%, #eef1f6 0%, rgba(238,241,246,0) 50%),
        var(--bg);
      background-attachment: fixed;
      color: var(--text); margin: 0; padding: 2.5rem 2rem;
      -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    }
    .card {
      max-width: 1320px; margin: 0 auto; background: var(--surface);
      padding: 2rem 2.25rem; border: 1px solid var(--border);
      border-radius: var(--radius-lg); box-shadow: var(--shadow-md);
    }
    .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
    h1 {
      margin: 0; font-size: 1.55rem; font-weight: 800; letter-spacing: -.02em;
      display: flex; align-items: center; gap: .6rem;
    }
    h1::before {
      content: ""; width: 10px; height: 26px; border-radius: 4px;
      background: linear-gradient(180deg, var(--accent), #3d8bff);
      box-shadow: 0 2px 8px rgba(0,102,220,.35);
    }
    p.sub { color: var(--text-3); margin: .5rem 0 0; font-size: .9rem; line-height: 1.5; max-width: 68ch; }
    p.sub code { background: var(--surface-2); border: 1px solid var(--border); padding: .05rem .35rem; border-radius: 5px; font-size: .82em; }

    .controls {
      display: flex; gap: .6rem; align-items: flex-end; flex-wrap: wrap;
      margin: 1.5rem 0 .5rem; padding: 1rem 1.1rem;
      background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius);
    }
    .controls label { display: block; font-weight: 600; margin-bottom: .35rem; font-size: .8rem; color: var(--text-2); }
    input[type=text] {
      padding: .58rem .75rem; border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
      font-size: .95rem; font-family: inherit; min-width: 220px; background: var(--surface);
      transition: border-color var(--ease), box-shadow var(--ease);
    }
    input[type=text]:focus { outline: none; border-color: var(--accent); box-shadow: var(--ring); }
    button {
      padding: .6rem 1.05rem; background: var(--accent); color: #fff; border: 1px solid transparent;
      border-radius: var(--radius-sm); font-size: .92rem; font-weight: 600; cursor: pointer;
      transition: background var(--ease), box-shadow var(--ease), transform var(--ease), border-color var(--ease), color var(--ease);
    }
    button:hover { background: var(--accent-hover); }
    button:active { transform: translateY(1px); }
    button.secondary { background: var(--surface); color: var(--accent); border-color: var(--border-strong); }
    button.secondary:hover { background: var(--accent-weak); border-color: var(--accent); }
    button:disabled { opacity: .55; cursor: not-allowed; transform: none; }
    :focus-visible { outline: none; box-shadow: var(--ring); border-radius: var(--radius-sm); }
    .spin {
      display: inline-block; width: 15px; height: 15px; vertical-align: middle;
      border: 2px solid rgba(0,102,220,.25); border-top-color: var(--accent);
      border-radius: 50%; animation: spin .6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .meta { color: var(--text-3); font-size: .85rem; margin: .5rem 0 1rem; }
    .meta strong { color: var(--text-2); }

    .tabs { display: flex; gap: .15rem; border-bottom: 1px solid var(--border); margin-bottom: .5rem; }
    .tab {
      background: none; color: var(--text-3); border: 0; border-bottom: 2px solid transparent;
      padding: .6rem .95rem; margin-bottom: -1px; font-size: .9rem; font-weight: 600;
      cursor: pointer; border-radius: 0; display: flex; align-items: center; gap: .45rem;
      transition: color var(--ease), border-color var(--ease);
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tcount { background: var(--accent-weak); color: var(--accent); border-radius: 999px; padding: .05rem .5rem; font-size: .74rem; font-weight: 700; transition: background var(--ease), color var(--ease); }
    .tab.active .tcount { background: var(--accent); color: #fff; }

    /* Passive completion progress (reflects the existing Done / total counts) */
    .progress { display: flex; align-items: center; gap: .75rem; margin: 0 0 1.5rem; }
    .progress-track { flex: 1; height: 7px; background: #e4e7ec; border-radius: 999px; overflow: hidden; }
    .progress-bar { height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, #12b76a, #32d583); transition: width .45s cubic-bezier(.4,0,.2,1); }
    .progress-label { font-size: .8rem; font-weight: 600; color: var(--text-3); white-space: nowrap; }

    section.stage { margin-bottom: 2rem; }
    section.stage h2 { font-size: 1rem; font-weight: 700; margin: 0 0 .6rem; display: flex; align-items: center; gap: .5rem; letter-spacing: -.01em; }
    .gcount { background: var(--accent-weak); color: var(--accent); border-radius: 999px; padding: .05rem .55rem; font-size: .78rem; font-weight: 700; }
    .no-stage h2 { color: var(--text-4); }
    .no-stage .gcount { background: #f2f4f7; color: var(--text-3); }

    /* Video list — one self-contained row per video: content clusters left,
       a tight status + action block sits right. No wide table, no dead gaps. */
    .v-list { border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); background: var(--surface); overflow: hidden; }
    .v-item {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 2rem;
      padding: 1rem 1.25rem; border-bottom: 1px solid var(--border);
      transition: background var(--ease);
    }
    .v-item:last-child { border-bottom: 0; }
    .v-item:hover { background: var(--surface-2); }
    .v-item.dnp { background: #fef3f2; }
    .v-item.dnp:hover { background: #fee4e2; }
    .v-item.dnp code.id { background: #fee4e2; color: #b42318; }
    .v-item.done { background: #f6fef9; }
    .v-item.done:hover { background: #ecfdf3; }
    .v-item.done .v-title { text-decoration: line-through; opacity: .65; }

    .v-main { flex: 1 1 auto; min-width: 0; }
    .v-title { font-size: 1rem; font-weight: 700; line-height: 1.35; color: var(--text); letter-spacing: -.01em; }
    .v-tags { margin-top: .65rem; }

    .v-side { flex: 0 0 auto; width: 300px; display: flex; flex-direction: column; align-items: flex-end; gap: .6rem; }
    .v-status { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; justify-content: flex-end; }
    .v-actions { display: flex; gap: .4rem; flex-wrap: wrap; justify-content: flex-end; }
    .v-utils { display: flex; gap: .35rem; align-items: center; justify-content: flex-end; opacity: .5; transition: opacity var(--ease); }
    .v-item:hover .v-utils, .v-item:focus-within .v-utils { opacity: 1; }
    .v-utils:has(.unhide-btn) { opacity: 1; }  /* unhide is the main action on hidden rows */

    @media (max-width: 760px) {
      .v-item { flex-direction: column; gap: .85rem; }
      .v-side { width: 100%; align-items: flex-start; }
      .v-status, .v-actions, .v-utils { justify-content: flex-start; }
    }

    .done-toggle {
      padding: .35rem .65rem; font-size: .78rem; background: var(--surface); color: var(--accent);
      border: 1px solid var(--border-strong); border-radius: var(--radius-sm); cursor: pointer; white-space: nowrap;
      font-weight: 600; transition: background var(--ease), border-color var(--ease), color var(--ease);
    }
    .done-toggle:hover { background: var(--accent-weak); border-color: var(--accent); }
    .done-toggle.is-done { background: #067647; color: #fff; border-color: #067647; }
    .done-toggle.is-done:hover { background: #05663d; }
    .done-toggle:disabled { opacity: .5; cursor: wait; }
    .done-toggle .plus-public { display: block; font-size: .7rem; font-weight: 700; opacity: .8; }
    .publish-btn {
      padding: .35rem .65rem; font-size: .78rem; background: var(--accent); color: #fff;
      border: 1px solid transparent; border-radius: var(--radius-sm); cursor: pointer; white-space: nowrap;
      font-weight: 600; transition: background var(--ease);
    }
    .publish-btn:hover { background: var(--accent-hover); }
    .publish-btn:disabled { opacity: .6; cursor: wait; }
    /* Hide is reversible + secondary: keep it a quiet ghost until hovered. */
    .hide-btn, .unhide-btn {
      padding: .3rem .5rem; font-size: .78rem; background: transparent; color: var(--text-3);
      border: 1px solid transparent; border-radius: var(--radius-sm); cursor: pointer; white-space: nowrap;
      font-weight: 600; transition: background var(--ease), border-color var(--ease), color var(--ease);
    }
    .hide-btn:hover { background: var(--surface-2); color: var(--text); border-color: var(--border-strong); }
    .unhide-btn { color: var(--accent); }
    .unhide-btn:hover { background: var(--accent-weak); border-color: var(--accent); }
    /* Secondary reference metadata, tucked under the title. */
    .row-meta { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; margin-top: .5rem; font-size: .75rem; font-weight: 400; color: var(--text-4); }
    .row-meta .dot { color: var(--border-strong); }
    .row-meta code.id { font-size: .72rem; padding: .1rem .35rem; }
    .v-utils .watch { font-size: .78rem; padding: .3rem .5rem; border-radius: var(--radius-sm); }
    .v-utils .watch:hover { background: var(--accent-weak); text-decoration: none; }
    .tag { display: inline-block; background: #f2f4f7; color: var(--text-2); border-radius: 6px; padding: .12rem .45rem; margin: 0 .25rem .25rem 0; font-size: .75rem; font-weight: 500; }
    .tag.stage-tag { background: var(--accent-weak); color: var(--accent); font-weight: 600; }
    .id-cell { display: flex; align-items: center; gap: .4rem; }
    code.id { background: #f2f4f7; padding: .18rem .45rem; border-radius: 6px; font-size: .8rem; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .copy { padding: .28rem .55rem; font-size: .75rem; background: var(--surface); color: var(--accent); border: 1px solid var(--border-strong); border-radius: 6px; cursor: pointer; transition: background var(--ease), border-color var(--ease), color var(--ease); }
    .copy:hover { background: var(--accent-weak); border-color: var(--accent); }
    .copy.copied { background: #ecfdf3; color: #067647; border-color: #a6f4c5; }
    .pill { display: inline-block; padding: .15rem .55rem; border-radius: 999px; font-size: .74rem; font-weight: 600; }
    .pill.private { background: #fef3f2; color: #b42318; }
    .pill.public { background: #ecfdf3; color: #067647; }
    .pill.draft { background: #fffaeb; color: #b54708; }
    /* Description column */
    .has-desc { color: #067647; font-weight: 600; font-size: .8rem; }
    .add-desc-btn {
      padding: .35rem .65rem; font-size: .78rem; background: #fffaeb; color: #b54708;
      border: 1px solid #fedf89; border-radius: var(--radius-sm); cursor: pointer; white-space: nowrap; font-weight: 700;
      transition: background var(--ease);
    }
    .add-desc-btn:hover { background: #fef0c7; }
    .add-desc-btn.no-match { background: var(--surface); color: var(--text-4); border-color: var(--border-strong); font-weight: 600; }
    .add-desc-btn.no-match:hover { background: var(--surface-2); }
    /* Inline title suggestion */
    .title-suggest { margin-top: .4rem; font-weight: 400; font-size: .78rem; color: var(--text-3); white-space: normal; line-height: 1.35; }
    .title-suggest .ts-label { font-weight: 700; color: #b54708; }
    .title-suggest .ts-text { color: var(--text); }
    .fix-title-btn, .fix-tags-btn {
      display: inline-block; margin-top: .3rem; padding: .28rem .6rem; font-size: .75rem;
      background: #fffaeb; color: #b54708; border: 1px solid #fedf89; border-radius: var(--radius-sm);
      cursor: pointer; font-weight: 700; white-space: nowrap; transition: background var(--ease);
    }
    .fix-title-btn:hover, .fix-tags-btn:hover { background: #fef0c7; }
    .fix-title-btn.tentative, .fix-tags-btn.tentative { background: var(--surface); color: var(--text-3); border-color: var(--border-strong); font-weight: 600; }
    .fix-title-btn.tentative:hover, .fix-tags-btn.tentative:hover { background: var(--surface-2); }
    .m-input { width: 100%; padding: .6rem .75rem; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); font-size: .95rem; font-family: inherit; transition: border-color var(--ease), box-shadow var(--ease); }
    .m-input:focus { outline: none; border-color: var(--accent); box-shadow: var(--ring); }
    .muted { color: var(--text-4); }
    a.watch { color: var(--accent); text-decoration: none; font-weight: 600; transition: color var(--ease); }
    a.watch:hover { color: var(--accent-hover); text-decoration: underline; }

    /* Floating toast */
    #status {
      position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 60;
      max-width: min(400px, calc(100vw - 3rem)); padding: .85rem 1.1rem;
      border-radius: var(--radius); box-shadow: var(--shadow-lg); display: none;
      font-size: .9rem; font-weight: 500; border: 1px solid transparent;
      animation: toastIn .28s cubic-bezier(.4,0,.2,1);
    }
    @keyframes toastIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    #status.err { background: #fef3f2; color: #b42318; border-color: #fecdca; display: block; }
    #status.info { background: #eff8ff; color: #175cd3; border-color: #b2ddff; display: block; }

    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(16,24,40,.5); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; padding: 1.5rem; z-index: 50; animation: overlayIn .2s ease; }
    @keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }
    .modal-overlay[hidden] { display: none; }
    .modal { background: var(--surface); border-radius: var(--radius-lg); width: 100%; max-width: 620px; max-height: 90vh; display: flex; flex-direction: column; box-shadow: var(--shadow-lg); animation: modalIn .24s cubic-bezier(.4,0,.2,1); }
    @keyframes modalIn { from { opacity: 0; transform: translateY(16px) scale(.98); } to { opacity: 1; transform: none; } }
    .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 1.1rem 1.4rem; border-bottom: 1px solid var(--border); }
    .modal-head h2 { margin: 0; font-size: 1.15rem; font-weight: 700; letter-spacing: -.01em; }
    .modal-x { background: none; border: 0; color: var(--text-3); font-size: 1.6rem; line-height: 1; cursor: pointer; padding: 0 .3rem; border-radius: 6px; transition: color var(--ease), background var(--ease); }
    .modal-x:hover { color: var(--text); background: var(--surface-2); }
    .modal-body { padding: 1.2rem 1.4rem; overflow-y: auto; }
    .modal-label { font-weight: 700; font-size: .74rem; text-transform: uppercase; letter-spacing: .04em; color: var(--text-3); margin: 1.1rem 0 .45rem; }
    .modal-label:first-child { margin-top: 0; }
    .modal-vtitle { font-size: 1.15rem; font-weight: 700; line-height: 1.3; }
    .modal-vid { margin-top: .45rem; }
    .modal select, .modal textarea {
      width: 100%; padding: .6rem .75rem; border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
      font-size: .9rem; font-family: inherit; transition: border-color var(--ease), box-shadow var(--ease);
    }
    .modal select:focus, .modal textarea:focus { outline: none; border-color: var(--accent); box-shadow: var(--ring); }
    .modal textarea { min-height: 150px; resize: vertical; line-height: 1.5; }
    .modal-foot { display: flex; justify-content: flex-end; gap: .6rem; padding: 1rem 1.4rem; border-top: 1px solid var(--border); }
    .conf { display: inline-block; border-radius: 999px; padding: .12rem .55rem; font-size: .72rem; font-weight: 700; margin-left: .4rem; }
    .conf.exact { background: #d1fadf; color: #067647; }
    .conf.strong { background: #d1e9ff; color: #175cd3; }
    .conf.review { background: #fef0c7; color: #b54708; }
    .conf.none { background: #fee4e2; color: #b42318; }
    .modal .hint { font-size: .8rem; color: var(--text-3); margin: .6rem 0 0; line-height: 1.5; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="top">
      <div>
        <h1>EFOC Video Hub</h1>
        <p class="sub">Tagged Dailymotion videos, grouped by <code>stage:&lt;name&gt;</code>. Descriptions come from the bundled EFOC trackers.</p>
      </div>
    </div>

    <div class="controls">
      <div>
        <label for="tag">Tag</label>
        <input type="text" id="tag" value="EFOC26" placeholder="EFOC26" />
      </div>
      <button id="load">Load</button>
      <button id="refresh" class="secondary" title="Re-fetch from Dailymotion">↻ Refresh from Dailymotion</button>
      <span id="refresh-spin" class="spin" style="display:none" aria-label="Refreshing"></span>
    </div>

    <div class="meta" id="meta"></div>
    <div class="tabs" id="tabs" style="display:none">
      <button class="tab active" data-tab="todo">To do <span class="tcount" id="count-todo">0</span></button>
      <button class="tab" data-tab="done">Done <span class="tcount" id="count-done">0</span></button>
      <button class="tab" data-tab="all">All <span class="tcount" id="count-all">0</span></button>
      <button class="tab" data-tab="hidden">Hidden <span class="tcount" id="count-hidden">0</span></button>
    </div>
    <div class="progress" id="progress" style="display:none">
      <div class="progress-track"><div class="progress-bar" id="progress-bar"></div></div>
      <span class="progress-label" id="progress-label"></span>
    </div>
    <div id="results"></div>
    <div id="status"></div>
  </div>

  <!-- Add-description modal -->
  <div id="modal" class="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-heading">
      <div class="modal-head">
        <h2 id="m-heading">Add description</h2>
        <button class="modal-x" id="m-close" aria-label="Close">×</button>
      </div>
      <div class="modal-body">
        <div class="modal-label">Video</div>
        <div class="modal-vtitle" id="m-title"></div>
        <div class="modal-vid"><code class="id" id="m-id"></code></div>

        <div class="modal-label">Tracker source <span id="m-conf"></span></div>
        <select id="m-source"></select>

        <div class="modal-label" id="m-editor-label">Description</div>
        <input type="text" id="m-input" class="m-input" hidden placeholder="Title from the tracker…" />
        <textarea id="m-desc" placeholder="Description from the tracker…"></textarea>
        <p class="hint" id="m-hint"></p>
      </div>
      <div class="modal-foot">
        <button class="secondary" id="m-cancel">Cancel</button>
        <button id="m-confirm">Confirm</button>
      </div>
    </div>
  </div>

  <script>
    const tagInput = document.getElementById('tag');
    const loadBtn = document.getElementById('load');
    const refreshBtn = document.getElementById('refresh');
    const refreshSpin = document.getElementById('refresh-spin');
    const results = document.getElementById('results');
    const meta = document.getElementById('meta');
    const status = document.getElementById('status');
    const tabs = document.getElementById('tabs');

    let allVideos = [];
    let activeTab = 'todo';
    let doneSet = new Set();
    let hiddenSet = new Set();
    let descRows = [];              // [{ mediaId, title, description, day }]
    const matchById = new Map();    // video id -> { tier, score, row, proposed }

    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    // ---- Title matching (bundled tracker rows are the source of truth) ------
    function normTitle(s) {
      return String(s || '')
        .toLowerCase()
        .replace(/\([^)]*\)/g, ' ')
        .replace(/\[[^\]]*\]/g, ' ')
        .replace(/&/g, ' and ')
        .replace(/[^a-z0-9 ]+/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }
    function tokenSet(s) { return new Set(normTitle(s).split(' ').filter(Boolean)); }
    function dice(a, b) {
      const A = tokenSet(a), B = tokenSet(b);
      if (!A.size || !B.size) return 0;
      let inter = 0; for (const x of A) if (B.has(x)) inter++;
      return (2 * inter) / (A.size + B.size);
    }
    function score(a, b) {
      const na = normTitle(a), nb = normTitle(b);
      if (!na || !nb) return 0;
      let s = dice(a, b);
      if (na === nb) return 1;
      if (na.includes(nb) || nb.includes(na)) s = Math.max(s, 0.85);
      return s;
    }
    const STRONG = 0.7, REVIEW = 0.45;

    function buildMatches() {
      matchById.clear();
      const byId = new Map();
      for (const r of descRows) if (r.mediaId) byId.set(r.mediaId.toLowerCase(), r);
      for (const v of allVideos) {
        const idHit = byId.get(String(v.id).toLowerCase());
        let m;
        if (idHit) {
          m = { tier: 'exact', score: 1, row: idHit };
        } else {
          let best = null, bs = 0;
          for (const r of descRows) { const sc = score(v.title, r.title); if (sc > bs) { bs = sc; best = r; } }
          const tier = bs >= STRONG ? 'strong' : bs >= REVIEW ? 'review' : 'none';
          m = { tier, score: bs, row: bs > 0 ? best : null };
        }
        m.proposed = m.row ? String(m.row.description || '').trim() : '';
        matchById.set(String(v.id), m);
      }
    }

    function confBadge(m) {
      if (!m) return '';
      if (m.tier === 'exact') return '<span class="conf exact">✓ ID match</span>';
      const pct = Math.round(m.score * 100);
      if (m.tier === 'strong') return `<span class="conf strong">Strong ${pct}%</span>`;
      if (m.tier === 'review') return `<span class="conf review">Review ${pct}% — check this</span>`;
      return '<span class="conf none">No confident match — pick below</span>';
    }

    const hasDescription = (v) => !!(v.description && String(v.description).trim());

    function fmtDuration(secs) {
      if (!secs && secs !== 0) return '—';
      const h = Math.floor(secs / 3600), m = Math.floor((secs % 3600) / 60), s = Math.floor(secs % 60);
      const pad = (n) => String(n).padStart(2, '0');
      return h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
    }
    function fmtDate(unix) {
      if (!unix) return '—';
      return new Date(unix * 1000).toLocaleString(undefined, {
        year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit',
      });
    }
    function visibilityPill(v) {
      if (v.private) return '<span class="pill private">Private</span>';
      if (v.published) return '<span class="pill public">Public</span>';
      return '<span class="pill draft">Unpublished</span>';
    }
    function tagChips(tags) {
      if (!tags || !tags.length) return '<span class="muted">—</span>';
      return tags.map((t) => {
        const isStage = /^stage:/i.test(t);
        return `<span class="tag${isStage ? ' stage-tag' : ''}">${esc(t)}</span>`;
      }).join('');
    }

    // Tracker tags (comma-separated string) the video doesn't already have.
    function missingTags(videoTags, trackerStr) {
      const have = new Set((videoTags || []).map((t) => String(t).toLowerCase()));
      const out = [];
      for (const part of String(trackerStr || '').split(',')) {
        const tag = part.trim();
        if (tag && !have.has(tag.toLowerCase())) out.push(tag);
      }
      return out;
    }

    // Merge existing video tags with tracker tags (dedup, case-insensitive),
    // keeping existing tags (e.g. stage:*) first — returns a comma-separated string.
    function mergeTags(videoTags, trackerStr) {
      const seen = new Set();
      const out = [];
      const add = (t) => {
        const tag = String(t || '').trim();
        if (!tag) return;
        const k = tag.toLowerCase();
        if (seen.has(k)) return;
        seen.add(k); out.push(tag);
      };
      (videoTags || []).forEach(add);
      String(trackerStr || '').split(',').forEach(add);
      return out.join(', ');
    }

    const isDNP = (title) => /(^|[^a-z])DNP([^a-z]|$)/i.test(String(title || ''));
    const isPublic = (v) => !v.private && v.published;

    // Deep-link to the individual video in the partner dashboard, e.g.
    // dailymotion.com/partner/x4fnf6g/media/video/details/xalnuqq
    function dashboardUrl(v) {
      const owner = v['owner.id'];
      return owner
        ? `https://www.dailymotion.com/partner/${owner}/media/video/details/${v.id}`
        : `https://studio.dailymotion.com/media/${v.id}/edit`;
    }

    // The Description cell: a green tick when the video already has one, else an
    // "Add description" button that opens the modal pre-filled from the tracker.
    function descCell(v) {
      if (hasDescription(v)) return '<span class="has-desc">✓ Has description</span>';
      const m = matchById.get(String(v.id));
      const noMatch = !(m && m.proposed);
      return `<button class="add-desc-btn${noMatch ? ' no-match' : ''}" data-id="${esc(v.id)}">+ Add description</button>`;
    }

    // The Title cell shows the current title, plus a "Use title" suggestion when
    // a matched tracker row has a different (cleaner) title.
    function titleCell(v) {
      const base = esc(v.title) || '<span class="muted">(untitled)</span>';
      const m = matchById.get(String(v.id));
      if (!m || !m.row || !m.row.title) return base;
      if (normTitle(m.row.title) === normTitle(v.title)) return base;  // already matches
      const confident = m.tier === 'exact' || m.tier === 'strong';
      if (confident) {
        // Show the proposed clean title inline for confident matches.
        return `${base}
          <div class="title-suggest">
            <span class="ts-label">Tracker:</span> “<span class="ts-text">${esc(m.row.title)}</span>”<br>
            <button class="fix-title-btn" data-id="${esc(v.id)}">✎ Use this title</button>
          </div>`;
      }
      // Low confidence — don't display a possibly-wrong guess; let them pick in the modal.
      return `${base}
        <div class="title-suggest">
          <button class="fix-title-btn tentative" data-id="${esc(v.id)}">✎ Set title from tracker…</button>
        </div>`;
    }

    // The Tags cell shows the current tag chips, plus an "Add tags" suggestion
    // when the matched tracker row has tags the video is missing. Applying them
    // merges with (never replaces) the existing tags, so stage:* tags are kept.
    function tagsCell(v) {
      const chips = tagChips(v.tags);
      const m = matchById.get(String(v.id));
      const trackerTags = m && m.row ? String(m.row.tags || '').trim() : '';
      if (!trackerTags) return chips;
      const missing = missingTags(v.tags, trackerTags);
      if (!missing.length) return chips;   // already has every tracker tag
      const confident = m.tier === 'exact' || m.tier === 'strong';
      if (confident) {
        return `${chips}
          <div class="title-suggest">
            <button class="fix-tags-btn" data-id="${esc(v.id)}">＋ Add tags: ${esc(missing.join(', '))}</button>
          </div>`;
      }
      return `${chips}
        <div class="title-suggest">
          <button class="fix-tags-btn tentative" data-id="${esc(v.id)}">＋ Add tags from tracker…</button>
        </div>`;
    }

    function rowFor(v) {
      const done = doneSet.has(String(v.id));
      const cls = ['v-item', isDNP(v.title) ? 'dnp' : '', done ? 'done' : ''].filter(Boolean).join(' ');
      const pub = isPublic(v);
      const views = v.views_total != null ? Number(v.views_total).toLocaleString() + ' views' : '— views';
      return `
        <div class="${cls}" data-row-id="${esc(v.id)}">
          <div class="v-main">
            <div class="v-title">${titleCell(v)}</div>
            <div class="row-meta">
              <code class="id">${esc(v.id)}</code>
              <button class="copy" data-id="${esc(v.id)}" title="Copy media ID">Copy</button>
              <span class="dot">·</span>${fmtDuration(v.duration)}
              <span class="dot">·</span>${esc(fmtDate(v.created_time))}
              <span class="dot">·</span>${views}
            </div>
            <div class="v-tags">${tagsCell(v)}</div>
          </div>
          <div class="v-side">
            <div class="v-status">
              ${visibilityPill(v)}
              ${descCell(v)}
            </div>
            <div class="v-actions">
              ${pub ? '' : `<button class="publish-btn" data-id="${esc(v.id)}">Publish</button>`}
              <button class="done-toggle${done ? ' is-done' : ''}" data-id="${esc(v.id)}">${done ? '✓ Done' : 'Mark done'}</button>
            </div>
            <div class="v-utils">
              <a class="watch" href="${esc(dashboardUrl(v))}" target="_blank" rel="noopener">Dashboard ↗</a>
              ${hiddenSet.has(String(v.id))
                ? `<button class="unhide-btn" data-id="${esc(v.id)}" title="Restore to the other tabs">↩ Unhide</button>`
                : `<button class="hide-btn" data-id="${esc(v.id)}" title="Hide from all tabs">Hide</button>`}
            </div>
          </div>
        </div>`;
    }

    function tableFor(videos) {
      return `<div class="v-list">${videos.map(rowFor).join('')}</div>`;
    }

    const isDoneV = (v) => doneSet.has(String(v.id));
    const isHiddenV = (v) => hiddenSet.has(String(v.id));

    function renderTabs() {
      // Hidden videos are excluded from every other tab and from progress.
      const visible = allVideos.filter((v) => !isHiddenV(v));
      const total = visible.length;
      const done = visible.filter(isDoneV).length;
      const hidden = allVideos.length - total;
      document.getElementById('count-todo').textContent = total - done;
      document.getElementById('count-done').textContent = done;
      document.getElementById('count-all').textContent = total;
      document.getElementById('count-hidden').textContent = hidden;
      tabs.style.display = allVideos.length ? 'flex' : 'none';
      for (const t of tabs.querySelectorAll('.tab')) {
        t.classList.toggle('active', t.dataset.tab === activeTab);
      }
      // Passive completion indicator — mirrors the Done / total counts, and like
      // those counts it ignores hidden videos entirely.
      const progress = document.getElementById('progress');
      if (total) {
        const pct = Math.round((done / total) * 100);
        document.getElementById('progress-bar').style.width = pct + '%';
        document.getElementById('progress-label').textContent = `${done} of ${total} done · ${pct}%`;
        progress.style.display = 'flex';
      } else {
        progress.style.display = 'none';
      }
    }

    function render() {
      renderTabs();
      // Every tab except "hidden" shows only non-hidden videos.
      const visible = allVideos.filter((v) => !isHiddenV(v));
      let videos;
      if (activeTab === 'hidden') videos = allVideos.filter(isHiddenV);
      else if (activeTab === 'todo') videos = visible.filter((v) => !isDoneV(v));
      else if (activeTab === 'done') videos = visible.filter(isDoneV);
      else videos = visible;

      if (!allVideos.length) {
        results.innerHTML = '<p class="muted">No videos found for this tag.</p>';
        return;
      }
      if (!videos.length) {
        const msg = activeTab === 'done' ? 'Nothing marked done yet.'
          : activeTab === 'todo' ? 'All caught up — everything is marked done. 🎉'
          : activeTab === 'hidden' ? 'Nothing hidden.'
          : 'No videos found for this tag.';
        results.innerHTML = `<p class="muted">${msg}</p>`;
        return;
      }
      const groups = {};
      for (const v of videos) {
        const s = v.stage && v.stage.trim() ? v.stage.trim() : 'No stage';
        (groups[s] = groups[s] || []).push(v);
      }
      const names = Object.keys(groups).sort((a, b) => {
        if (a === 'No stage') return 1;
        if (b === 'No stage') return -1;
        return a.localeCompare(b, undefined, { numeric: true });
      });
      results.innerHTML = names.map((name) => `
        <section class="stage${name === 'No stage' ? ' no-stage' : ''}">
          <h2>${name === 'No stage' ? 'No stage' : 'Stage: ' + esc(name)} <span class="gcount">${groups[name].length}</span></h2>
          ${tableFor(groups[name])}
        </section>`).join('');
    }

    // ---- Field modal (shared by "Add description" + "Use title") -----------
    const modal = document.getElementById('modal');
    const mHeading = document.getElementById('m-heading');
    const mTitle = document.getElementById('m-title');
    const mId = document.getElementById('m-id');
    const mConf = document.getElementById('m-conf');
    const mSource = document.getElementById('m-source');
    const mEditorLabel = document.getElementById('m-editor-label');
    const mInput = document.getElementById('m-input');    // title editor (single line)
    const mDesc = document.getElementById('m-desc');       // description editor (textarea)
    const mHint = document.getElementById('m-hint');
    const mConfirm = document.getElementById('m-confirm');
    let modalVideoId = null;
    let modalField = 'description';   // 'description' | 'title' | 'tags'

    // Description uses the textarea; title + tags use the single-line input.
    const editor = () => (modalField === 'description' ? mDesc : mInput);
    // The tracker value to propose for the current mode. Tags merge with the
    // current video's existing tags so nothing already set is lost.
    const rowValue = (r) => {
      if (modalField === 'title') return String(r.title || '').trim();
      if (modalField === 'description') return String(r.description || '').trim();
      const v = allVideos.find((x) => String(x.id) === modalVideoId);
      return mergeTags(v && v.tags, r.tags);
    };

    const CONFIG = {
      description: { heading: 'Add description', label: 'Description', confirm: 'Confirm & add',
        placeholder: 'Description from the tracker…',
        hint: 'This writes the description to the live Dailymotion video. Titles and tags are left untouched.',
        verb: 'Adding description', done: 'Description added' },
      title: { heading: 'Update title', label: 'Title', confirm: 'Update title',
        placeholder: 'Title from the tracker…',
        hint: 'This overwrites the title on the live Dailymotion video. Description and tags are left untouched.',
        verb: 'Updating title', done: 'Title updated' },
      tags: { heading: 'Add tags', label: 'Tags (comma-separated)', confirm: 'Update tags',
        placeholder: 'Tags, comma-separated…',
        hint: 'This replaces the tags on the live Dailymotion video with exactly this list — existing tags are already merged in and kept. Title and description are left untouched.',
        verb: 'Updating tags', done: 'Tags updated' },
    };

    function sourceOptions(selectedRow) {
      const opts = ['<option value="">— none / clear —</option>'];
      descRows.forEach((r, i) => {
        const sel = r === selectedRow ? ' selected' : '';
        const metaBits = [r.day, r.mediaId].filter(Boolean).join(' · ');
        opts.push(`<option value="${i}"${sel}>${esc(r.title)}${metaBits ? ' · ' + esc(metaBits) : ''}</option>`);
      });
      return opts.join('');
    }

    function updateConfirmState() { mConfirm.disabled = !editor().value.trim(); }

    function openModal(id, field) {
      const v = allVideos.find((x) => String(x.id) === String(id));
      if (!v) return;
      modalVideoId = String(id);
      modalField = (field === 'title' || field === 'tags') ? field : 'description';
      const cfg = CONFIG[modalField];
      const m = matchById.get(String(id));

      mHeading.textContent = cfg.heading;
      mEditorLabel.textContent = cfg.label;
      mConfirm.textContent = cfg.confirm;
      mHint.textContent = cfg.hint;
      mTitle.textContent = v.title || '(untitled)';   // always show the video title
      mId.textContent = v.id;
      mConf.innerHTML = confBadge(m);
      mSource.innerHTML = sourceOptions(m && m.row);

      // Show the right editor, hide the other.
      const isDesc = modalField === 'description';
      const isTitle = modalField === 'title';
      const isTags = modalField === 'tags';
      mDesc.hidden = !isDesc;
      mInput.hidden = isDesc;
      mInput.placeholder = cfg.placeholder;
      const confident = m && (m.tier === 'exact' || m.tier === 'strong');
      if (isTags) {
        // Always seed the current tags; add tracker tags only on a confident match.
        editor().value = mergeTags(v.tags, (m && m.row && confident) ? m.row.tags : '');
      } else {
        // Pre-fill the best match — for titles only when the match is confident,
        // so a low-confidence guess isn't silently written as the title.
        const prefill = m && m.row && (!isTitle || confident);
        editor().value = prefill ? rowValue(m.row) : '';
      }

      updateConfirmState();
      modal.hidden = false;
      editor().focus();
    }

    function closeModal() { modal.hidden = true; modalVideoId = null; }

    mSource.addEventListener('change', () => {
      const val = mSource.value;
      if (val === '') { editor().value = ''; mConf.innerHTML = ''; }
      else {
        editor().value = rowValue(descRows[+val]);
        mConf.innerHTML = '<span class="conf strong">✓ Chosen</span>';
      }
      updateConfirmState();
    });
    mDesc.addEventListener('input', updateConfirmState);
    mInput.addEventListener('input', updateConfirmState);
    document.getElementById('m-close').addEventListener('click', closeModal);
    document.getElementById('m-cancel').addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !modal.hidden) closeModal(); });

    mConfirm.addEventListener('click', async () => {
      const id = modalVideoId;
      const value = editor().value.trim();
      const cfg = CONFIG[modalField];
      if (!id || !value) return;
      mConfirm.disabled = true;
      mConfirm.textContent = 'Saving…';
      status.className = 'info';
      status.textContent = `${cfg.verb} on Dailymotion…`;
      try {
        const body = modalField === 'title' ? { id, title: value }
          : modalField === 'tags' ? { id, tags: value }
          : { id, description: value };
        const res = await fetch('/api/update-video', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (!res.ok || !data.success) throw new Error(data.error || 'Request failed');
        const v = allVideos.find((x) => String(x.id) === String(id));
        if (v) {
          if (data.video) Object.assign(v, data.video);
          else if (modalField === 'title') v.title = value;
          else if (modalField === 'tags') v.tags = value.split(',').map((s) => s.trim()).filter(Boolean);
          else v.description = value;
        }
        closeModal();
        buildMatches();   // title/description changed — refresh suggestions
        render();
        status.className = 'info';
        status.textContent = `✓ ${cfg.done} on Dailymotion.`;
      } catch (err) {
        status.className = 'err';
        status.textContent = '❌ ' + err.message;
      } finally {
        mConfirm.disabled = false;
        mConfirm.textContent = cfg.confirm;
      }
    });

    // Open the modal from the "Add description" / "Use title" buttons.
    results.addEventListener('click', (e) => {
      const desc = e.target.closest('.add-desc-btn');
      if (desc) return openModal(desc.dataset.id, 'description');
      const title = e.target.closest('.fix-title-btn');
      if (title) return openModal(title.dataset.id, 'title');
      const tags = e.target.closest('.fix-tags-btn');
      if (tags) return openModal(tags.dataset.id, 'tags');
    });

    // ---- Done toggle (also publishes) --------------------------------------
    results.addEventListener('click', async (e) => {
      const btn = e.target.closest('.done-toggle');
      if (!btn) return;
      const id = String(btn.dataset.id);
      const makeDone = !doneSet.has(id);
      if (makeDone) doneSet.add(id); else doneSet.delete(id);
      render();

      if (!makeDone) {
        try {
          const res = await fetch('/api/done', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id, done: false }),
          });
          const data = await res.json();
          if (!res.ok || !data.success) throw new Error(data.error || 'Request failed');
        } catch (err) {
          doneSet.add(id); render();
          status.className = 'err';
          status.textContent = '❌ Could not save: ' + err.message;
        }
        return;
      }

      status.className = 'info';
      status.textContent = 'Marking done…';

      try {
        const res = await fetch('/api/done', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id, done: true }),
        });
        const data = await res.json();
        if (!res.ok || !data.success) throw new Error(data.error || 'Request failed');
        status.className = 'info';
        status.textContent = '✓ Marked done.';
      } catch (err) {
        doneSet.delete(id); render();
        status.className = 'err';
        status.textContent = '❌ Could not mark done: ' + err.message;
      }
    });

    // ---- Publish -----------------------------------------------------------
    results.addEventListener('click', async (e) => {
      const btn = e.target.closest('.publish-btn');
      if (!btn) return;
      const id = String(btn.dataset.id);
      btn.disabled = true;
      btn.textContent = 'Publishing…';
      try {
        const res = await fetch('/api/publish', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id }),
        });
        const data = await res.json();
        if (!res.ok || !data.success) throw new Error(data.error || 'Request failed');
        const v = allVideos.find((x) => String(x.id) === id);
        if (v) { if (data.video) Object.assign(v, data.video); else { v.private = false; v.published = true; } }
        render();
        status.className = 'info';
        status.textContent = '✓ Published on Dailymotion.';
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Publish';
        status.className = 'err';
        status.textContent = '❌ Could not publish: ' + err.message;
      }
    });

    // ---- Hide / Unhide -----------------------------------------------------
    // Hiding tucks a video into the "Hidden" tab and out of every other tab and
    // the progress bar. It leaves the video (and its done status) untouched, so
    // unhiding restores it to whichever tab its status puts it in.
    async function setHiddenState(id, hidden) {
      if (hidden) hiddenSet.add(id); else hiddenSet.delete(id);
      render();
      try {
        const res = await fetch('/api/hidden', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id, hidden }),
        });
        const data = await res.json();
        if (!res.ok || !data.success) throw new Error(data.error || 'Request failed');
        status.className = 'info';
        status.textContent = hidden ? '🙈 Hidden.' : '↩ Restored.';
      } catch (err) {
        if (hidden) hiddenSet.delete(id); else hiddenSet.add(id);
        render();
        status.className = 'err';
        status.textContent = '❌ Could not update: ' + err.message;
      }
    }

    results.addEventListener('click', (e) => {
      const hideBtn = e.target.closest('.hide-btn');
      if (hideBtn) return setHiddenState(String(hideBtn.dataset.id), true);
      const unhideBtn = e.target.closest('.unhide-btn');
      if (unhideBtn) return setHiddenState(String(unhideBtn.dataset.id), false);
    });

    // ---- Tabs + copy -------------------------------------------------------
    tabs.addEventListener('click', (e) => {
      const t = e.target.closest('.tab');
      if (!t || t.dataset.tab === activeTab) return;
      activeTab = t.dataset.tab;
      render();
    });

    results.addEventListener('click', async (e) => {
      const btn = e.target.closest('.copy');
      if (!btn) return;
      const id = btn.dataset.id;
      try { await navigator.clipboard.writeText(id); }
      catch {
        const ta = document.createElement('textarea');
        ta.value = id; document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); ta.remove();
      }
      const orig = btn.textContent;
      btn.textContent = 'Copied ✓';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 1500);
    });

    function showMeta(data) {
      const when = data.cachedAt ? new Date(data.cachedAt).toLocaleString() : 'unknown';
      const src = data.cached ? 'from cache' : 'freshly fetched';
      const dcount = descRows.length ? ` · ${descRows.length} tracker rows loaded` : '';
      meta.innerHTML = `${data.count} video${data.count === 1 ? '' : 's'} tagged <strong>#${esc(data.tag)}</strong> — last updated ${esc(when)} (${src})${dcount}.`;
    }

    // Load the bundled tracker descriptions once.
    async function loadDescriptions() {
      try {
        const res = await fetch('/api/descriptions');
        const data = await res.json();
        if (res.ok && Array.isArray(data.rows)) descRows = data.rows;
      } catch { /* non-fatal: the Add-description button just won't pre-fill */ }
    }

    async function fetchVideos({ refresh }) {
      const tag = tagInput.value.trim() || 'EFOC26';
      loadBtn.disabled = refreshBtn.disabled = true;
      if (refresh) {
        refreshSpin.style.display = 'inline-block';
        status.style.display = 'none';
      } else {
        status.className = 'info';
        status.textContent = 'Loading…';
        meta.textContent = '';
        results.innerHTML = '';
        tabs.style.display = 'none';
      }
      try {
        const url = '/api/videos' + (refresh ? '/refresh' : '') + '?tag=' + encodeURIComponent(tag);
        const [res, doneRes, hiddenRes] = await Promise.all([
          fetch(url, { method: refresh ? 'POST' : 'GET' }),
          fetch('/api/done'),
          fetch('/api/hidden'),
        ]);
        const data = await res.json();
        if (!res.ok || data.error) throw new Error(data.error || 'Request failed');
        try {
          const dd = await doneRes.json();
          if (Array.isArray(dd.done)) doneSet = new Set(dd.done.map(String));
        } catch { /* non-fatal */ }
        try {
          const hh = await hiddenRes.json();
          if (Array.isArray(hh.hidden)) hiddenSet = new Set(hh.hidden.map(String));
        } catch { /* non-fatal */ }
        refreshSpin.style.display = 'none';
        loadBtn.disabled = refreshBtn.disabled = false;
        status.style.display = 'none';
        allVideos = data.videos || [];
        buildMatches();
        showMeta(data);
        render();
      } catch (err) {
        refreshSpin.style.display = 'none';
        loadBtn.disabled = refreshBtn.disabled = false;
        status.className = 'err';
        status.textContent = '❌ ' + err.message;
      }
    }

    loadBtn.addEventListener('click', () => fetchVideos({ refresh: false }));
    refreshBtn.addEventListener('click', () => fetchVideos({ refresh: true }));
    tagInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') fetchVideos({ refresh: false }); });

    // Load descriptions first (so matches are ready), then the videos.
    loadDescriptions().then(() => fetchVideos({ refresh: false }));
  </script>
</body>
</html>
