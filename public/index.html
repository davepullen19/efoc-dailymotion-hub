<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dailymotion Uploader</title>
  <style>
    :root { --bg: #0a0a23; --accent: #0066dc; --border: #d0d5dd; }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f7fa; color: #1a1a2e; margin: 0; padding: 2rem;
    }
    .card {
      max-width: 640px; margin: 0 auto; background: #fff; padding: 2rem;
      border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,.06);
    }
    h1 { margin-top: 0; font-size: 1.4rem; }
    p.sub { color: #667085; margin-top: -.5rem; font-size: .9rem; }
    label { display: block; font-weight: 600; margin: 1rem 0 .35rem; font-size: .9rem; }
    input[type=text], input[type=file], textarea, select {
      width: 100%; padding: .6rem .7rem; border: 1px solid var(--border);
      border-radius: 8px; font-size: .95rem; font-family: inherit;
    }
    textarea { min-height: 80px; resize: vertical; }
    .checks { margin-top: 1rem; }
    .checks label { display: flex; align-items: center; gap: .5rem; font-weight: 500; }
    .checks input { width: auto; }
    button {
      margin-top: 1.5rem; width: 100%; padding: .8rem; background: var(--accent);
      color: #fff; border: 0; border-radius: 8px; font-size: 1rem; font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .req { color: #d92d20; }
    #status { margin-top: 1.25rem; padding: .85rem 1rem; border-radius: 8px; display: none; font-size: .9rem; }
    #status.ok { background: #ecfdf3; color: #067647; display: block; }
    #status.err { background: #fef3f2; color: #b42318; display: block; }
    #status a { color: inherit; font-weight: 600; }
    #progress { margin-top: 1.25rem; display: none; }
    #progress.show { display: block; }
    .bar { height: 10px; background: #eaecf0; border-radius: 999px; overflow: hidden; }
    .bar > span {
      display: block; height: 100%; width: 0%; background: var(--accent);
      border-radius: 999px; transition: width .15s ease;
    }
    .bar.indeterminate > span {
      width: 40%; background: var(--accent);
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide {
      0% { margin-left: -40%; } 100% { margin-left: 100%; }
    }
    .bar-meta {
      display: flex; justify-content: space-between; margin-top: .4rem;
      font-size: .82rem; color: #667085;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Upload to Dailymotion</h1>
    <p class="sub">A simple demo of the Dailymotion Partner API upload flow.
      &nbsp;·&nbsp; <a href="/videos.html">Browse tagged videos →</a></p>

    <form id="form">
      <label>Upload to profile <span class="req">*</span></label>
      <select name="profileId" id="profile" required>
        <option value="">Loading profiles…</option>
      </select>

      <label>Video file <span class="req">*</span></label>
      <input type="file" name="video" accept="video/*" required />

      <label>Title <span class="req">*</span></label>
      <input type="text" name="title" maxlength="255" required />

      <label>Channel (category) <span class="req">*</span></label>
      <select name="channel" required>
        <option value="">Select a channel…</option>
        <option value="news">News &amp; Politics</option>
        <option value="tv">TV &amp; Comedy</option>
        <option value="music">Music</option>
        <option value="sport">Sport</option>
        <option value="videogames">Video Games</option>
        <option value="fun">Fun &amp; Entertainment</option>
        <option value="tech">Tech &amp; Science</option>
        <option value="auto">Cars &amp; Vehicles</option>
        <option value="lifestyle">Lifestyle &amp; How-to</option>
        <option value="travel">Travel</option>
        <option value="animals">Animals</option>
        <option value="people">People &amp; Blogs</option>
        <option value="shortfilms">Movies &amp; Short Films</option>
        <option value="creation">Creative</option>
        <option value="kids">Kids</option>
      </select>

      <label>Description</label>
      <textarea name="description" maxlength="3000"></textarea>

      <label>Tags (comma-separated)</label>
      <input type="text" name="tags" placeholder="funny, cats, tutorial" />

      <div class="checks">
        <label><input type="checkbox" name="published" checked /> Published (embeddable / visible)</label>
        <label><input type="checkbox" name="private" /> Private (restricted access)</label>
        <label><input type="checkbox" name="is_created_for_kids" /> Made for kids (COPPA/GDPR)</label>
      </div>

      <button type="submit" id="btn">Upload video</button>
    </form>

    <div id="progress">
      <div class="bar" id="bar"><span id="barFill"></span></div>
      <div class="bar-meta">
        <span id="barPct">0%</span>
        <span id="barSpeed"></span>
      </div>
    </div>

    <div id="status"></div>
  </div>

  <script>
    const form = document.getElementById('form');
    const btn = document.getElementById('btn');
    const status = document.getElementById('status');
    const profile = document.getElementById('profile');
    const progress = document.getElementById('progress');
    const bar = document.getElementById('bar');
    const barFill = document.getElementById('barFill');
    const barPct = document.getElementById('barPct');
    const barSpeed = document.getElementById('barSpeed');

    const fmtBytes = (n) => {
      if (n < 1024) return n + ' B';
      const units = ['KB', 'MB', 'GB', 'TB'];
      let i = -1;
      do { n /= 1024; i++; } while (n >= 1024 && i < units.length - 1);
      return n.toFixed(n < 10 ? 1 : 0) + ' ' + units[i];
    };

    // Load the profiles this API key can upload to.
    (async () => {
      try {
        const { profiles, error } = await (await fetch('/api/profiles')).json();
        if (error) throw new Error(error);
        profile.innerHTML = '<option value="">Select a profile…</option>' +
          profiles.map(p =>
            `<option value="${p.id}">${p.screenname || p.username} (${p.id})</option>`
          ).join('');
      } catch (err) {
        profile.innerHTML = '<option value="">Could not load profiles</option>';
        status.className = 'err';
        status.textContent = '❌ Could not load profiles: ' + err.message;
      }
    })();

    // POST the file straight to Dailymotion's upload URL, reporting live
    // percent + speed. Resolves with the hosted file URL.
    function uploadToDailymotion(uploadUrl, file) {
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open('POST', uploadUrl);

        const startedAt = Date.now();
        xhr.upload.addEventListener('progress', (ev) => {
          if (!ev.lengthComputable) return;
          const pct = Math.round((ev.loaded / ev.total) * 100);
          barFill.style.width = pct + '%';
          barPct.textContent = pct + '%';

          const elapsed = (Date.now() - startedAt) / 1000;
          if (elapsed > 0) {
            barSpeed.textContent = fmtBytes(ev.loaded / elapsed) + '/s';
          }
        });

        xhr.addEventListener('load', () => {
          let data = {};
          try { data = JSON.parse(xhr.responseText); } catch {}
          if (xhr.status >= 200 && xhr.status < 300 && data.url) {
            resolve(data.url);
          } else {
            reject(new Error(data.error?.message || data.message || `Upload failed (HTTP ${xhr.status})`));
          }
        });
        xhr.addEventListener('error', () => reject(new Error('Network error during upload.')));

        const fd = new FormData();
        fd.append('file', file);
        xhr.send(fd);
      });
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const file = form.querySelector('input[name=video]').files[0];
      if (!file) return;

      btn.disabled = true;
      btn.textContent = 'Uploading…';
      status.className = '';
      status.style.display = 'none';

      // Reset + show the progress bar.
      progress.classList.add('show');
      bar.classList.remove('indeterminate');
      barFill.style.width = '0%';
      barPct.textContent = '0%';
      barSpeed.textContent = '';

      try {
        // 1. Ask our server for a one-time Dailymotion upload URL.
        const urlRes = await (await fetch('/api/upload-url')).json();
        if (urlRes.error) throw new Error(urlRes.error);

        // 2. Upload the file directly to Dailymotion (this is the tracked leg).
        const fileUrl = await uploadToDailymotion(urlRes.uploadUrl, file);

        // 3. Hosted; now our server creates + publishes the video.
        barFill.style.width = '100%';
        barPct.textContent = '100%';
        bar.classList.add('indeterminate');
        barSpeed.textContent = '';
        btn.textContent = 'Publishing…';

        const res = await fetch('/api/create-video', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            fileUrl,
            profileId: form.profileId.value,
            title: form.title.value,
            channel: form.channel.value,
            description: form.description.value,
            tags: form.tags.value,
            published: form.published.checked,
            private: form.private.checked,
            is_created_for_kids: form.is_created_for_kids.checked,
          }),
        });
        const data = await res.json();
        if (!data.success) throw new Error(data.error || 'Unknown error');

        status.className = 'ok';
        const owner = data.owner ? ` to <strong>${data.owner.screenname || data.owner.username}</strong>` : '';
        status.innerHTML = `✅ Uploaded${owner}! Video ID <strong>${data.id}</strong> — <a href="${data.watch}" target="_blank">watch it</a>`;
      } catch (err) {
        status.className = 'err';
        status.textContent = '❌ ' + err.message;
      } finally {
        progress.classList.remove('show');
        bar.classList.remove('indeterminate');
        btn.disabled = false;
        btn.textContent = 'Upload video';
      }
    });
  </script>
</body>
</html>
