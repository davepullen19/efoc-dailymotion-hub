<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dailymotion — Tagged Videos</title>
  <style>
    :root { --bg: #0a0a23; --accent: #0066dc; --border: #d0d5dd; }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f7fa; color: #1a1a2e; margin: 0; padding: 2rem;
    }
    .card {
      max-width: 1200px; margin: 0 auto; background: #fff; padding: 2rem;
      border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,.06);
    }
    .top { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
    h1 { margin-top: 0; font-size: 1.4rem; }
    p.sub { color: #667085; margin-top: -.5rem; font-size: .9rem; }
    a.nav { color: var(--accent); font-weight: 600; font-size: .9rem; text-decoration: none; }
    .controls { display: flex; gap: .5rem; align-items: flex-end; margin: 1rem 0 .5rem; flex-wrap: wrap; }
    .controls label { display: block; font-weight: 600; margin-bottom: .35rem; font-size: .85rem; }
    input[type=text] {
      padding: .55rem .7rem; border: 1px solid var(--border); border-radius: 8px;
      font-size: .95rem; font-family: inherit; min-width: 200px;
    }
    button {
      padding: .6rem 1rem; background: var(--accent); color: #fff; border: 0;
      border-radius: 8px; font-size: .95rem; font-weight: 600; cursor: pointer;
    }
    button.secondary { background: #fff; color: var(--accent); border: 1px solid var(--border); }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .spin {
      display: inline-block; width: 15px; height: 15px; vertical-align: middle;
      border: 2px solid rgba(0,102,220,.25); border-top-color: var(--accent);
      border-radius: 50%; animation: spin .6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .meta { color: #667085; font-size: .85rem; margin: .25rem 0 1rem; }
    .tabs { display: flex; gap: .25rem; border-bottom: 1px solid var(--border); margin-bottom: 1.25rem; }
    .tab {
      background: none; color: #667085; border: 0; border-bottom: 2px solid transparent;
      padding: .55rem .9rem; margin-bottom: -1px; font-size: .9rem; font-weight: 600;
      cursor: pointer; border-radius: 0; display: flex; align-items: center; gap: .4rem;
    }
    .tab:hover { color: #1a1a2e; }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tcount { background: #eef2ff; color: #3538cd; border-radius: 999px; padding: .05rem .5rem; font-size: .75rem; font-weight: 700; }
    .tab.active .tcount { background: var(--accent); color: #fff; }
    section.stage { margin-bottom: 2rem; }
    section.stage h2 { font-size: 1.05rem; margin: 0 0 .6rem; display: flex; align-items: center; gap: .5rem; }
    .gcount { background: #eef2ff; color: #3538cd; border-radius: 999px; padding: .05rem .55rem; font-size: .8rem; font-weight: 700; }
    .no-stage h2 { color: #98a2b3; }
    .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; }
    table { border-collapse: collapse; width: 100%; font-size: .85rem; }
    th, td { text-align: left; padding: .6rem .7rem; border-bottom: 1px solid #eaecf0; vertical-align: top; white-space: nowrap; }
    th { background: #f9fafb; font-weight: 600; color: #475467; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: #fafbfc; }
    tbody tr.dnp td { background: #fef3f2; color: #b42318; }
    tbody tr.dnp:hover td { background: #fee4e2; }
    tbody tr.dnp code.id { background: #fee4e2; color: #b42318; }
    tbody tr.done td { background: #ecfdf3; color: #087443; }
    tbody tr.done:hover td { background: #d1fadf; }
    tbody tr.done td.title { text-decoration: line-through; opacity: .75; }
    /* When a video is both DNP and done, "done" wins visually. */
    tbody tr.done.dnp td { background: #ecfdf3; color: #087443; }
    .done-toggle {
      padding: .3rem .6rem; font-size: .78rem; background: #fff; color: var(--accent);
      border: 1px solid var(--border); border-radius: 6px; cursor: pointer; white-space: nowrap;
    }
    .done-toggle.is-done { background: #067647; color: #fff; border-color: #067647; }
    .done-toggle:disabled { opacity: .5; cursor: wait; }
    .done-toggle .plus-public { display: block; font-size: .7rem; font-weight: 700; opacity: .8; }
    .publish-btn {
      padding: .3rem .6rem; font-size: .78rem; background: var(--accent); color: #fff;
      border: 0; border-radius: 6px; cursor: pointer; white-space: nowrap;
    }
    .publish-btn:disabled { opacity: .6; cursor: wait; }
    td.title { white-space: normal; min-width: 220px; font-weight: 600; }
    td.tags { white-space: normal; max-width: 220px; }
    .tag { display: inline-block; background: #f2f4f7; color: #475467; border-radius: 6px; padding: .1rem .4rem; margin: 0 .2rem .2rem 0; font-size: .75rem; }
    .tag.stage-tag { background: #eef2ff; color: #3538cd; font-weight: 600; }
    .id-cell { display: flex; align-items: center; gap: .4rem; }
    code.id { background: #f2f4f7; padding: .15rem .4rem; border-radius: 6px; font-size: .8rem; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .copy { padding: .25rem .5rem; font-size: .75rem; background: #fff; color: var(--accent); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; }
    .copy.copied { background: #ecfdf3; color: #067647; border-color: #a6f4c5; }
    .pill { display: inline-block; padding: .1rem .5rem; border-radius: 999px; font-size: .75rem; font-weight: 600; }
    .pill.private { background: #fef3f2; color: #b42318; }
    .pill.public { background: #ecfdf3; color: #067647; }
    .pill.draft { background: #fffaeb; color: #b54708; }
    .muted { color: #98a2b3; }
    a.watch { color: var(--accent); text-decoration: none; font-weight: 600; }
    #status { margin-top: 1rem; padding: .85rem 1rem; border-radius: 8px; display: none; font-size: .9rem; }
    #status.err { background: #fef3f2; color: #b42318; display: block; }
    #status.info { background: #eff8ff; color: #175cd3; display: block; }
  </style>
</head>
<body>
  <div class="card">
    <div class="top">
      <div>
        <h1>Tagged videos</h1>
        <p class="sub">Videos carrying a tag, grouped by <code>stage:&lt;name&gt;</code>. Cached — use Refresh to re-pull.</p>
      </div>
      <a class="nav" href="/">← Upload a video</a>
    </div>

    <div class="controls">
      <div>
        <label for="tag">Tag</label>
        <input type="text" id="tag" value="EFOC26" placeholder="EFOC26" />
      </div>
      <button id="load">Load</button>
      <button id="refresh" class="secondary" title="Re-fetch from Dailymotion">↻ Refresh from Dailymotion</button>
      <span id="refresh-spin" class="spin" style="display:none" aria-label="Refreshing"></span>
    </div>

    <div class="meta" id="meta"></div>
    <div class="tabs" id="tabs" style="display:none">
      <button class="tab active" data-tab="todo">To do <span class="tcount" id="count-todo">0</span></button>
      <button class="tab" data-tab="done">Done <span class="tcount" id="count-done">0</span></button>
      <button class="tab" data-tab="all">All <span class="tcount" id="count-all">0</span></button>
    </div>
    <div id="results"></div>
    <div id="status"></div>
  </div>

  <script>
    const tagInput = document.getElementById('tag');
    const loadBtn = document.getElementById('load');
    const refreshBtn = document.getElementById('refresh');
    const refreshSpin = document.getElementById('refresh-spin');
    const results = document.getElementById('results');
    const meta = document.getElementById('meta');
    const status = document.getElementById('status');
    const tabs = document.getElementById('tabs');

    // The full video list for the current tag + which tab is showing.
    let allVideos = [];
    let activeTab = 'todo'; // 'todo' | 'done' | 'all'

    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    // Video ids marked "done" — loaded from the server so it's shared and
    // survives re-pulls from Dailymotion.
    let doneSet = new Set();

    function fmtDuration(secs) {
      if (!secs && secs !== 0) return '—';
      const h = Math.floor(secs / 3600), m = Math.floor((secs % 3600) / 60), s = Math.floor(secs % 60);
      const pad = (n) => String(n).padStart(2, '0');
      return h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
    }

    function fmtDate(unix) {
      if (!unix) return '—';
      return new Date(unix * 1000).toLocaleString(undefined, {
        year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit',
      });
    }

    function visibilityPill(v) {
      if (v.private) return '<span class="pill private">Private</span>';
      if (v.published) return '<span class="pill public">Public</span>';
      return '<span class="pill draft">Unpublished</span>';
    }

    function tagChips(tags) {
      if (!tags || !tags.length) return '<span class="muted">—</span>';
      return tags.map((t) => {
        const isStage = /^stage:/i.test(t);
        return `<span class="tag${isStage ? ' stage-tag' : ''}">${esc(t)}</span>`;
      }).join('');
    }

    // "DNP" (do not publish) videos are flagged red. Match it as a standalone
    // token — separated by anything non-alphabetic (e.g. "Amazon_DNP", "DNP:")
    // — so titles like "Sudnpost" don't trip it.
    const isDNP = (title) => /(^|[^a-z])DNP([^a-z]|$)/i.test(String(title || ''));

    // A video is "public" once it's published and not private.
    const isPublic = (v) => !v.private && v.published;

    function rowFor(v) {
      const done = doneSet.has(String(v.id));
      const cls = [isDNP(v.title) ? 'dnp' : '', done ? 'done' : ''].filter(Boolean).join(' ');
      return `
        <tr${cls ? ` class="${cls}"` : ''} data-row-id="${esc(v.id)}">
          <td><button class="done-toggle${done ? ' is-done' : ''}" data-id="${esc(v.id)}">${done ? '✓ Done' : (isPublic(v) ? 'Mark done' : 'Mark done<br><span class="plus-public">+ public</span>')}</button></td>
          <td><div class="id-cell"><code class="id">${esc(v.id)}</code>
            <button class="copy" data-id="${esc(v.id)}" title="Copy media ID">Copy</button></div></td>
          <td class="title">${esc(v.title) || '<span class="muted">(untitled)</span>'}</td>
          <td>${fmtDuration(v.duration)}</td>
          <td>${esc(fmtDate(v.created_time))}</td>
          <td>${v.views_total != null ? Number(v.views_total).toLocaleString() : '—'}</td>
          <td>${visibilityPill(v)}</td>
          <td class="tags">${tagChips(v.tags)}</td>
          <td>${v.url ? `<a class="watch" href="${esc(v.url)}" target="_blank" rel="noopener">Watch ↗</a>` : '—'}</td>
          <td>${isPublic(v) ? '<span class="muted">—</span>' : `<button class="publish-btn" data-id="${esc(v.id)}">Publish</button>`}</td>
        </tr>`;
    }

    function tableFor(videos) {
      return `
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th>Done</th><th>Media ID</th><th>Title</th><th>Duration</th><th>Created</th>
              <th>Views</th><th>Visibility</th><th>Tags</th><th>Links</th><th>Publish</th>
            </tr></thead>
            <tbody>${videos.map(rowFor).join('')}</tbody>
          </table>
        </div>`;
    }

    const isDoneV = (v) => doneSet.has(String(v.id));

    // Refresh the tab counts + active state from the full list.
    function renderTabs() {
      const total = allVideos.length;
      const done = allVideos.filter(isDoneV).length;
      document.getElementById('count-todo').textContent = total - done;
      document.getElementById('count-done').textContent = done;
      document.getElementById('count-all').textContent = total;
      tabs.style.display = total ? 'flex' : 'none';
      for (const t of tabs.querySelectorAll('.tab')) {
        t.classList.toggle('active', t.dataset.tab === activeTab);
      }
    }

    function render() {
      renderTabs();
      let videos = allVideos;
      if (activeTab === 'todo') videos = allVideos.filter((v) => !isDoneV(v));
      else if (activeTab === 'done') videos = allVideos.filter(isDoneV);

      if (!allVideos.length) {
        results.innerHTML = '<p class="muted">No videos found for this tag.</p>';
        return;
      }
      if (!videos.length) {
        const msg = activeTab === 'done' ? 'Nothing marked done yet.'
          : activeTab === 'todo' ? 'All caught up — everything is marked done. 🎉'
          : 'No videos found for this tag.';
        results.innerHTML = `<p class="muted">${msg}</p>`;
        return;
      }
      // Group by the parsed stage; videos with no stage go last.
      const groups = {};
      for (const v of videos) {
        const s = v.stage && v.stage.trim() ? v.stage.trim() : 'No stage';
        (groups[s] = groups[s] || []).push(v);
      }
      const names = Object.keys(groups).sort((a, b) => {
        if (a === 'No stage') return 1;
        if (b === 'No stage') return -1;
        return a.localeCompare(b, undefined, { numeric: true });
      });
      results.innerHTML = names.map((name) => `
        <section class="stage${name === 'No stage' ? ' no-stage' : ''}">
          <h2>${name === 'No stage' ? 'No stage' : 'Stage: ' + esc(name)} <span class="gcount">${groups[name].length}</span></h2>
          ${tableFor(groups[name])}
        </section>`).join('');
    }

    // Toggle "done" (event delegation across all tables). Optimistic UI:
    // flip the styling immediately, then persist; revert on failure.
    // Marking done ALSO makes the video public on Dailymotion. Un-marking only
    // clears the done flag (it doesn't un-publish).
    results.addEventListener('click', async (e) => {
      const btn = e.target.closest('.done-toggle');
      if (!btn) return;
      const id = String(btn.dataset.id);
      const makeDone = !doneSet.has(id);

      // Apply optimistically + re-render so it moves tab and counts update.
      if (makeDone) doneSet.add(id); else doneSet.delete(id);
      render();

      // Un-marking: just persist done=false, leave DM visibility as-is.
      if (!makeDone) {
        try {
          const res = await fetch('/api/done', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id, done: false }),
          });
          const data = await res.json();
          if (!res.ok || !data.success) throw new Error(data.error || 'Request failed');
        } catch (err) {
          doneSet.add(id);
          render();
          status.className = 'err';
          status.textContent = '❌ Could not save: ' + err.message;
        }
        return;
      }

      // Only publish if the video isn't already public.
      const vid = allVideos.find((x) => String(x.id) === id);
      const needsPublish = vid ? !isPublic(vid) : true;

      status.className = 'info';
      status.textContent = needsPublish
        ? 'Marking done + publishing on Dailymotion…'
        : 'Marking done…';

      // 1) Persist the done mark.
      try {
        const res = await fetch('/api/done', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id, done: true }),
        });
        const data = await res.json();
        if (!res.ok || !data.success) throw new Error(data.error || 'Request failed');
      } catch (err) {
        doneSet.delete(id);
        render();
        status.className = 'err';
        status.textContent = '❌ Could not mark done: ' + err.message;
        return;
      }

      // Already public — done is saved, nothing more to do.
      if (!needsPublish) {
        status.className = 'info';
        status.textContent = '✓ Marked done.';
        return;
      }

      // 2) Make it public on Dailymotion. The done mark is already saved, so
      //    keep it even if publishing fails — just surface the publish error.
      try {
        const res = await fetch('/api/publish', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id }),
        });
        const data = await res.json();
        if (!res.ok || !data.success) throw new Error(data.error || 'Request failed');
        const v = allVideos.find((x) => String(x.id) === id);
        if (v) {
          if (data.video) Object.assign(v, data.video);
          else { v.private = false; v.published = true; }
        }
        render();
        status.className = 'info';
        status.textContent = '✓ Marked done and published on Dailymotion.';
      } catch (err) {
        status.className = 'err';
        status.textContent = '⚠ Marked done, but could not publish: ' + err.message;
      }
    });

    // Publish a not-yet-public video on Dailymotion (event delegation).
    results.addEventListener('click', async (e) => {
      const btn = e.target.closest('.publish-btn');
      if (!btn) return;
      const id = String(btn.dataset.id);
      btn.disabled = true;
      btn.textContent = 'Publishing…';
      try {
        const res = await fetch('/api/publish', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id }),
        });
        const data = await res.json();
        if (!res.ok || !data.success) throw new Error(data.error || 'Request failed');
        // Reflect the new visibility in our copy, then re-render.
        const v = allVideos.find((x) => String(x.id) === id);
        if (v) {
          if (data.video) Object.assign(v, data.video);
          else { v.private = false; v.published = true; }
        }
        render();
        status.className = 'info';
        status.textContent = '✓ Published on Dailymotion.';
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Publish';
        status.className = 'err';
        status.textContent = '❌ Could not publish: ' + err.message;
      }
    });

    // Switch tabs.
    tabs.addEventListener('click', (e) => {
      const t = e.target.closest('.tab');
      if (!t || t.dataset.tab === activeTab) return;
      activeTab = t.dataset.tab;
      render();
    });

    // Copy-to-clipboard (event delegation across all tables).
    results.addEventListener('click', async (e) => {
      const btn = e.target.closest('.copy');
      if (!btn) return;
      const id = btn.dataset.id;
      try {
        await navigator.clipboard.writeText(id);
      } catch {
        const ta = document.createElement('textarea');
        ta.value = id; document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); ta.remove();
      }
      const orig = btn.textContent;
      btn.textContent = 'Copied ✓';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 1500);
    });

    function showMeta(data) {
      const when = data.cachedAt ? new Date(data.cachedAt).toLocaleString() : 'unknown';
      const src = data.cached ? 'from cache' : 'freshly fetched';
      meta.innerHTML = `${data.count} video${data.count === 1 ? '' : 's'} tagged <strong>#${esc(data.tag)}</strong> — last updated ${esc(when)} (${src}).`;
    }

    async function fetchVideos({ refresh }) {
      const tag = tagInput.value.trim() || 'EFOC26';
      loadBtn.disabled = refreshBtn.disabled = true;
      if (refresh) {
        // Keep the current list on screen; just show a small spinner.
        refreshSpin.style.display = 'inline-block';
        status.style.display = 'none';
      } else {
        // A fresh load (possibly a different tag) — clear and show a message.
        status.className = 'info';
        status.textContent = 'Loading…';
        meta.textContent = '';
        results.innerHTML = '';
        tabs.style.display = 'none';
      }
      try {
        const url = '/api/videos' + (refresh ? '/refresh' : '') + '?tag=' + encodeURIComponent(tag);
        // Load the videos and the shared "done" set together.
        const [res, doneRes] = await Promise.all([
          fetch(url, { method: refresh ? 'POST' : 'GET' }),
          fetch('/api/done'),
        ]);
        const data = await res.json();
        if (!res.ok || data.error) throw new Error(data.error || 'Request failed');
        try {
          const dd = await doneRes.json();
          if (Array.isArray(dd.done)) doneSet = new Set(dd.done.map(String));
        } catch { /* non-fatal: fall back to showing nothing as done */ }
        refreshSpin.style.display = 'none';
        loadBtn.disabled = refreshBtn.disabled = false;
        status.style.display = 'none';
        showMeta(data);
        allVideos = data.videos || [];
        render();
      } catch (err) {
        refreshSpin.style.display = 'none';
        loadBtn.disabled = refreshBtn.disabled = false;
        status.className = 'err';
        status.textContent = '❌ ' + err.message;
      }
    }

    loadBtn.addEventListener('click', () => fetchVideos({ refresh: false }));
    refreshBtn.addEventListener('click', () => fetchVideos({ refresh: true }));
    tagInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') fetchVideos({ refresh: false }); });
    fetchVideos({ refresh: false }); // load #EFOC26 from cache on open
  </script>
</body>
</html>
